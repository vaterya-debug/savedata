    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- SheetJS (解析 Excel) -->

    <!-- Chart.js -->

        /* 響應式地圖高度：手機較矮、桌面全螢幕扣除標頭 */
        #map { height: 350px; background: #0f172a; }
        @media (min-width: 768px) {
            #map { height: calc(100vh - 140px); }
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
        }

                <div>

            <button onclick="loadGoogleSheet()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition shrink-0 shadow">

        function loadGoogleSheet() {
            const url = document.getElementById('sheetUrlInput').value.trim();
            if (!url) { alert('請輸入連結！'); return; }
            let csvUrl = url;
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match && match[1]) {
                csvUrl = `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
            }
            Papa.parse(csvUrl, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data;
                    filteredData = [...rawData];
                    updateSystemState(`試算表同步成功 (${rawData.length}筆)`);
                },
                error: function(err) { alert('讀取失敗，請確認共用權限。'); }
            });
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            if (file.name.endsWith('.csv')) {
                reader.onload = function(e) {
                    Papa.parse(e.target.result, {
                        header: true, skipEmptyLines: true,
                        complete: function(results) {
                            rawData = results.data;
                            filteredData = [...rawData];
                            updateSystemState(`檔案載入成功 (${rawData.length}筆)`);
                        }
                    });
                };
                reader.readAsText(file);
            } else {
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    filteredData = [...rawData];
                    updateSystemState(`Excel 載入成功 (${rawData.length}筆)`);
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function updateSystemState(msg) {
            document.getElementById('dataStatus').innerText = msg;
            document.getElementById('dataStatusMobile').innerText = "就緒";
            initFilters();
            updateVisualization();
        }

        function initFilters() {
            const years = [...new Set(rawData.map(i => i['發生日期/年']))].filter(Boolean).sort();
            const months = [...new Set(rawData.map(i => i['發生日期/月']))].filter(Boolean).sort((a,b)=>a-b);
            const regions = [...new Set(rawData.map(i => i['落水(獲報)地點/地名']))].filter(Boolean);

            populateSelect('filterYear', years, '全部年份');
            populateSelect('filterMonth', months, '全部月份');
            populateSelect('filterRegion', regions, '全部區域');
        }

        function populateSelect(elementId, options, defaultText) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<option value="">${defaultText}</option>` + 
                options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
        }

        function filterData() {
            const year = document.getElementById('filterYear').value;
            const month = document.getElementById('filterMonth').value;
            const region = document.getElementById('filterRegion').value;
            const result = document.getElementById('filterResult').value;

            filteredData = rawData.filter(item => {
                return (!year || item['發生日期/年'] == year) &&
                       (!month || item['發生日期/月'] == month) &&
                       (!region || item['落水(獲報)地點/地名'] == region) &&
                       (!result || item['處置結果'] == result);
            });

            updateVisualization();
        }

        // 計算耗時 (起訖時間相減)
        function calculateDuration(item) {
            try {
                const startYear = 1911 + parseInt(item['發生日期/年'] || 0);
                const endYear = 1911 + parseInt(item['結案(尋獲)時間/年'] || 0);
                const startDate = new Date(startYear, (item['發生日期/月'] || 1) - 1, item['發生日期/日'] || 1, ...((item['發生日期/時'] || '00:00:00').split(':')) );
                const endDate = new Date(endYear, (item['結案(尋獲)時間/月'] || 1) - 1, item['結案(尋獲)時間/日'] || 1, ...((item['結案(尋獲)時間/時'] || '00:00:00').split(':')) );
                
                const diffMs = endDate - startDate;
                if (diffMs < 0) return "計算中/時序異常";
                const diffHrs = (diffMs / (1000 * 60 * 60)).toFixed(1);
                if (diffHrs < 24) {
                    return `${diffHrs} 小時`;
                } else {
                    const diffDays = (diffHrs / 24).toFixed(1);
                    return `${diffDays} 天 (${diffHrs} 小時)`;
                }
            } catch(e) {
                return "時間格式無法解析";
            }
        }

        function updateVisualization() {
            layerGroup.clearLayers();
            renderCaseList();
            renderCharts();

            document.getElementById('caseCount').innerText = `${filteredData.length} 筆`;

            let bounds = [];

            filteredData.forEach(item => {
                const fLat = parseFloat(item['落水(獲報)地點/緯度']);
                const fLng = parseFloat(item['落水(獲報)地點/經度']);
                const rLat = parseFloat(item['尋獲地點/緯度']);
                const rLng = parseFloat(item['尋獲地點/經度']);

                if (!isNaN(fLat) && !isNaN(fLng)) {
                    bounds.push([fLat, fLng]);

                    const fallMarker = L.circleMarker([fLat, fLng], {
                        radius: 6,
                        fillColor: '#3b82f6',
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).bindTooltip(`落水: ${item['落水(獲報)地點/地名'] || ''}`);

                    fallMarker.on('click', () => zoomToCase(fLat, fLng, rLat, rLng, item));
                    layerGroup.addLayer(fallMarker);

                    if (!isNaN(rLat) && !isNaN(rLng)) {
                        bounds.push([rLat, rLng]);
                        const colorMap = { '生還': '#10b981', '死亡': '#ef4444', '未尋獲': '#f59e0b' };
                        const foundColor = colorMap[item['處置結果']] || '#94a3b8';

                        const foundMarker = L.circleMarker([rLat, rLng], {
                            radius: 6,
                            fillColor: foundColor,
                            color: '#ffffff',
                            weight: 1.5,
                            opacity: 1,
                            fillOpacity: 0.9
                        }).bindTooltip(`尋獲: ${item['尋獲地點/地名'] || ''} (${item['處置結果']})`);

                        foundMarker.on('click', () => zoomToCase(fLat, fLng, rLat, rLng, item));
                        layerGroup.addLayer(foundMarker);

                        const polyline = L.polyline([[fLat, fLng], [rLat, rLng]], {
                            color: foundColor,
                            weight: 2,
                            opacity: 0.7,
                            dashArray: '5, 5'
                        });
                        layerGroup.addLayer(polyline);
                    }
                }
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });
            }
        }

        // 點擊案件：縮放至該案件區域並顯示精簡卡片
        function zoomToCase(fLat, fLng, rLat, rLng, item) {
            let latlngs = [[fLat, fLng]];
            if (!isNaN(rLat) && !isNaN(rLng)) latlngs.push([rLat, rLng]);
            
            if (latlngs.length > 1) {
                map.fitBounds(latlngs, { padding: [100, 100], maxZoom: 15 });
            } else {
                map.setView([fLat, fLng], 14);
            }
            showCaseCard(item);
        }

        function renderCaseList() {
            const container = document.getElementById('caseListContainer');
            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">無符合條件的案件記錄</div>`;
                return;
            }

            container.innerHTML = filteredData.map((item) => {
                const duration = calculateDuration(item);
                const badgeColor = item['處置結果'] === '生還' ? 'bg-emerald-950 text-emerald-300 border-emerald-800' : 'bg-rose-950 text-rose-300 border-rose-800';
                
                const fLat = parseFloat(item['落水(獲報)地點/緯度']);
                const fLng = parseFloat(item['落水(獲報)地點/經度']);
                const rLat = parseFloat(item['尋獲地點/緯度']);
                const rLng = parseFloat(item['尋獲地點/經度']);

                return `
                    <div onclick='zoomToCase(${fLat}, ${fLng}, ${rLat}, ${rLng}, ${JSON.stringify(item)})' class="bg-slate-900 hover:bg-slate-800 border border-slate-800/80 p-2.5 rounded-lg cursor-pointer transition shadow-sm space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-200 text-xs">📅 民國${item['發生日期/年']}年${item['發生日期/月']}月</span>
                            <span class="px-2 py-0.5 rounded text-[10px] border ${badgeColor}">${item['處置結果'] || '未明'}</span>
                        </div>
                        <p class="text-slate-300 text-[11px] truncate">📍 落水：${item['落水(獲報)地點/地名'] || '無紀錄'}</p>
                        <p class="text-slate-300 text-[11px] truncate">🎯 尋獲：${item['尋獲地點/地名'] || '同落水點'}</p>
                        <p class="text-blue-400 text-[10px]">⏱️ 耗時：${duration}</p>
                    </div>
                `;
            }).join('');
        }

        // 僅呈現地點、耗時及結果
        function showCaseCard(item) {
            const duration = calculateDuration(item);
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <div class="flex py-2 justify-between items-center">
                    <span class="font-medium text-slate-400 w-1/3">📍 落水地點</span>
                    <span class="text-slate-100 w-2/3 text-right">${item['落水(獲報)地點/地名'] || '無紀錄'}</span>
                </div>
                <div class="flex py-2 justify-between items-center">
                    <span class="font-medium text-slate-400 w-1/3">🎯 尋獲地點</span>
                    <span class="text-slate-100 w-2/3 text-right">${item['尋獲地點/地名'] || '同落水點'}</span>
                </div>
                <div class="flex py-2 justify-between items-center">
                    <span class="font-medium text-slate-400 w-1/3">⏱️ 搜救耗時</span>
                    <span class="text-blue-400 font-bold w-2/3 text-right font-mono">${duration}</span>
                </div>
                <div class="flex py-2 justify-between items-center">
                    <span class="font-medium text-slate-400 w-1/3">📌 處置結果</span>
                    <span class="text-slate-100 w-2/3 text-right font-bold ${item['處置結果'] === '生還' ? 'text-emerald-400' : 'text-rose-400'}">${item['處置結果'] || '未明'}</span>
                </div>
                <div class="flex py-2 justify-between items-center">
                    <span class="font-medium text-slate-400 w-1/3">👥 遇險人數</span>
                    <span class="text-slate-100 w-2/3 text-right font-mono">${item['遇險人數'] || 1} 人</span>
                </div>
            `;

            const fLat = parseFloat(item['落水(獲報)地點/緯度']);
            const fLng = parseFloat(item['落水(獲報)地點/經度']);
            const rLat = parseFloat(item['尋獲地點/緯度']);
            const rLng = parseFloat(item['尋獲地點/經度']);
            document.getElementById('zoomModalBtn').onclick = function() {
                zoomToCase(fLat, fLng, rLat, rLng, item);
                closeModal();
            };

            document.getElementById('caseModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('caseModal').classList.add('hidden');
        }

        function renderCharts() {
            const resultCounts = { '生還': 0, '死亡': 0, '未尋獲': 0 };
            filteredData.forEach(item => {
                if (resultCounts[item['處置結果']] !== undefined) resultCounts[item['處置結果']]++;
            });

            const ctx1 = document.getElementById('resultChart').getContext('2d');
            if (resultChartInstance) resultChartInstance.destroy();
            resultChartInstance = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(resultCounts),
                    datasets: [{
                        data: Object.values(resultCounts),
                        backgroundColor: ['#10b981', '#ef4444', '#f59e0b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#cbd5e1', boxWidth: 10, font: { size: 10 } } } }
                }
            });

            const monthCounts = {};
            filteredData.forEach(item => {
                const m = item['發生日期/月'] ? `${item['發生日期/月']}月` : '未知';
                monthCounts[m] = (monthCounts[m] || 0) + 1;
            });

            const ctx2 = document.getElementById('monthChart').getContext('2d');
            if (monthChartInstance) monthChartInstance.destroy();
            monthChartInstance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: Object.keys(monthCounts),
                    datasets: [{
                        label: '案件數',
                        data: Object.values(monthCounts),
                        backgroundColor: '#3b82f6',
                        borderRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8', font: { size: 9 }, stepSize: 1 }, grid: { color: '#1e293b' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
